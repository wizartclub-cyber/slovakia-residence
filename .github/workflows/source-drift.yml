name: Source drift check
on:
  schedule: [{ cron: "0 6 * * 1" }]   # щопонеділка 06:00 UTC
  workflow_dispatch:
permissions: { contents: read, issues: write }
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pyyaml requests pypdf
      - id: v
        run: python3 scripts/download_and_hash.py --verify || echo "drift=1" >> "$GITHUB_OUTPUT"
      - if: steps.v.outputs.drift == '1'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo,
              title: `Source drift detected ${new Date().toISOString().slice(0,10)}`,
              body: 'Локальні снапшоти не збігаються з реєстром. Це лише тригер для юридичного перегляду, не автооновлення. Див. лог workflow.' })
