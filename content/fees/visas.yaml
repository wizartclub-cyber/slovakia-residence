# Візові збори. Позиція тарифу навмисно порожня (null): spec §5 називає для віз
# «інші застосовні позиції» 145/1995, не вказуючи номер. Вигадувати номер позиції
# не можна, тому поле лишається порожнім до перевірки за текстом тарифу.
# Для національної візи spec розрізняє випадки 15 €, 90 € і 50 €, але не каже,
# якій меті відповідає кожна сума — тому applicantConditions порожні.
