# Збори за тимчасове проживання (prechodný pobyt).
# Джерело сум: spec §5 (звірено з тарифом 145/1995 положка 24 і оновленням IOM
# від 16.07.2026). Це ДОВІДКОВІ позиції, не повний перелік: звільнення від збору
# і винятки оцінюються окремо. Усі записи мають reviewStatus draft до рев'ю юриста.
- id: fee-tr-business-first-ocp
  tariffItem: '145/1995 položka 24'
  amount: 330
  currency: EUR
  filingChannel: [ocp_pz]
  applicantConditions: []
  exemptions: []
  reductionRule: &electronic
    type: electronic_filing
    percent: 50
    maxReductionEur: 50
    condition: >-
      Знижка діє, тільки якщо електронна подача законно доступна для цієї процедури
      і дотримано приписаний електронний процес. Підготовка документів онлайн
      сама по собі права на знижку не дає (spec §5).
  validFrom: '2026-09-01'
  validTo: null
  reviewStatus: draft
  notes: Перше подання, підприємницька діяльність (§22), подача в поліції у справах іноземців.
  sourceIds: [slovlex-145-1995, iom-fees]

