# Збори за тимчасове проживання. Джерело: зákon 145/1995 Z. z., položka 24
# (снапшот slovlex-145-1995, sha256 у реєстрі) — прочитано 2026-09-09.
# Знижка за електронну подачу: §6 ods. 2 того ж закону.
# Звільнення внесені дослівно з розділу «Oslobodenie» положки 24.
- id: fee-tr-business-first-ocp
  tariffItem: '145/1995 položka 24 písm. a) bod 1'
  amount: 330
  currency: EUR
  filingChannel: [ocp_pz]
  applicantConditions: []
  exemptions:
    - id: ex-family-of-asylee
      description:
        uk: >-
          Звільнені особи, які просять возз'єднання родини з особою, якій надано
          притулок, або з іноземцем, якому надано додатковий захист
          (положка 24, Oslobodenie 1).
        sk: >-
          Oslobodené sú osoby, ktoré žiadajú zlúčenie rodiny s azylantom alebo
          s cudzincom s doplnkovou ochranou (položka 24, Oslobodenie 1).
      sourceIds: [slovlex-145-1995]
    - id: ex-teachers
      description:
        uk: >-
          Звільнені педагогічні працівники та викладачі вищих шкіл
          (положка 24, Oslobodenie 2).
        sk: >-
          Oslobodení sú pedagogickí zamestnanci a vysokoškolskí učitelia
          (položka 24, Oslobodenie 2).
      sourceIds: [slovlex-145-1995]
    - id: ex-under-18
      description:
        uk: >-
          Звільнені особи, молодші за 18 років (положка 24, Oslobodenie 3).
        sk: >-
          Oslobodené sú osoby mladšie ako 18 rokov (položka 24, Oslobodenie 3).
      sourceIds: [slovlex-145-1995]
    - id: ex-scholarship-reciprocity
      description:
        uk: >-
          На основі взаємності звільнені стажисти зі стипендією Міністерства
          освіти СР або стипендією за міжнародним договором, а також лектори
          іноземних мов, які приїздять до шкіл у СР за міжнародними договорами
          (положка 24, Oslobodenie 4).
        sk: >-
          Na základe vzájomnosti sú oslobodení stážisti so štipendiom ministerstva
          školstva alebo podľa medzinárodnej zmluvy a lektori cudzích jazykov
          prichádzajúci na školy v SR podľa medzinárodných zmlúv
          (položka 24, Oslobodenie 4).
      sourceIds: [slovlex-145-1995]
  reductionRule: &electronic
    type: electronic_filing
    percent: 50
    maxReductionEur: 50
    condition:
      uk: >-
        Якщо заяву подано електронними засобами (або через поштового оператора,
        що виконує функцію засвідчувача), ставка збору — 50 %, але зниження не
        більше ніж на 50 €. Якщо до заяви є додатки, знижена ставка діє лише тоді,
        коли ці додатки теж в електронній формі (§6 ods. 2).
      sk: >-
        Ak sa návrh podá elektronickými prostriedkami alebo prostredníctvom
        osvedčujúcej osoby, sadzba je 50 %, najviac však o 50 eur nižšia. Ak sú
        súčasťou návrhu prílohy, znížená sadzba platí len vtedy, ak sú prílohy
        v elektronickej podobe (§6 ods. 2).
    sourceIds: [slovlex-145-1995]
  waiverNote:
    uk: >-
      Орган може відпустити збір або знизити його з гуманітарних підстав чи з
      міркувань взаємності (положка 24, Splnomocnenie). Це рішення органу, не право.
    sk: >-
      Správny orgán môže od vybratia poplatku upustiť alebo ho znížiť z humanitného
      dôvodu alebo z dôvodu vzájomnosti (položka 24, Splnomocnenie).
  validFrom: '2026-09-01'
  validTo: null
  reviewStatus: source_verified
  notes: >-
    Перше подання, підприємництво (§22) · Prvé podanie, podnikanie (§22)
  sourceIds: [slovlex-145-1995]

