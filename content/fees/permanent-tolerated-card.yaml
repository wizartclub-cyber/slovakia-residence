# Постійне проживання, толероване перебування, картка проживання.
# Довідкові суми зі spec §5. Звільнення від збору НЕ внесені: IOM повідомляє про
# звільнення для осіб до 18 років і подружжя громадян СР при постійному проживанні,
# але SOURCE_AUDIT_v0.4 §8 вимагає звірити це з тарифом 145/1995 положка 24
# перед внесенням у поле exemptions.
- id: fee-permanent-application
