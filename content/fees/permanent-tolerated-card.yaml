- id: fee-residence-card-standard
  tariffItem: '145/1995 položka 24 písm. f) bod 1'
  amount: 10
  currency: EUR
  filingChannel: []
  applicantConditions: []
  exemptions:
    - id: ex-card-not-applicant-fault
      description:
        uk: >-
          Звільнені ті, хто просить новий документ про пробут, бо записи в ньому не відповідають дійсності з незалежної від них причини (зміна назви населеного пункту, вулиці, нумерації), і ті, кому надано притулок або додатковий захист і хто вперше просить документ про пробут (положка 24, Oslobodenie 6).
        sk: >-
          Oslobodené sú osoby žiadajúce nový doklad, ak záznamy nezodpovedajú skutočnosti z dôvodu nezávislého od žiadateľa, a azylanti alebo osoby s doplnkovou ochranou pri prvom doklade (položka 24, Oslobodenie 6).
      sourceIds: [slovlex-145-1995]
  reductionRule:
    type: electronic_filing
    percent: 50
    maxReductionEur: 50
    condition:
