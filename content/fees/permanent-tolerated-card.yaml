# Постійне проживання, толероване перебування, картки і паспорти.
# Джерело: 145/1995 položka 24 (прочитано у снапшоті 2026-09-09).
- id: fee-permanent-application
  tariffItem: '145/1995 položka 24 písm. c)'
  amount: 250
  currency: EUR
  filingChannel: []
  applicantConditions: []
  exemptions:
    - id: ex-under-18
      description:
        uk: >-
          Звільнені особи, молодші за 18 років (положка 24, Oslobodenie 3).
        sk: >-
          Oslobodené sú osoby mladšie ako 18 rokov (položka 24, Oslobodenie 3).
      sourceIds: [slovlex-145-1995]
    - id: ex-permanent-s43-1a
      description:
        uk: >-
          Звільнені особи за §43 ods. 1 písm. a) закону 404/2011 (положка 24, Oslobodenie 5).
        sk: >-
          Oslobodené sú osoby podľa §43 ods. 1 písm. a) zákona 404/2011 (položka 24, Oslobodenie 5).
      sourceIds: [slovlex-145-1995]
  reductionRule:
    type: electronic_filing
    percent: 50
    maxReductionEur: 50
    condition:
      uk: >-
        Ставка 50 % при поданні електронними засобами, зниження не більше ніж на
        50 €. Якщо є додатки, знижка діє лише коли вони теж в електронній формі
        (§6 ods. 2 закону 145/1995).
      sk: >-
        Sadzba 50 % pri elektronickom podaní, zníženie najviac o 50 eur. Ak sú
        prílohy, znížená sadzba platí len ak sú v elektronickej podobe
        (§6 ods. 2 zákona 145/1995).
    sourceIds: [slovlex-145-1995]
  waiverNote:
    uk: >-
      Орган може відпустити збір або знизити його з гуманітарних підстав чи з
      міркувань взаємності (положка 24, Splnomocnenie). Це рішення органу, не право.
    sk: >-
      Správny orgán môže od vybratia poplatku upustiť alebo ho znížiť z humanitného
      dôvodu alebo z dôvodu vzájomnosti (položka 24, Splnomocnenie).
  validFrom: '2026-09-01'
  validTo: null
  reviewStatus: source_verified
  notes: >-
    Заява про постійне проживання · Žiadosť o udelenie trvalého pobytu
  sourceIds: [slovlex-145-1995]

