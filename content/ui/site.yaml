# Конфігурація сайту: порядок пунктів меню та юридичний baseline.
# Тексти пунктів меню — у src/locales/<мова>/common.json за ключем nav.<key>.
# Змінювати тут, не в коді (CLAUDE.md §6).
legalBaseline:
  # Дата стану права, яку бачить відвідувач. Після першого юридичного рев'ю
  # замінити на дату рев'ю і поставити reviewCompleted: true.
  date: '2026-09-01'
  edition: 1
  reviewCompleted: false
  reviewer: null
nav:
  - key: home
    path: ''
  - key: finder
    path: 'finder'
  - key: routes
    path: 'routes'
  - key: booking
    path: 'booking'
  - key: faq
    path: 'faq'
  - key: authorities
    path: 'authorities'
  - key: sources
    path: 'sources'
  - key: about
    path: 'about'
  - key: privacy
    path: 'privacy'
# Публічна адреса сайту — для карти сайту й robots.txt.
publicUrl: https://wizartclub-cyber.github.io/slovakia-residence/
locales:
  - uk
  - sk
defaultLocale: uk
