openQuestions:
  - 'Умови надання шенгенської візи встановлює Візовий кодекс (Регламент ЄС 810/2009), якого в реєстрі немає — тут описано лише доповнення словацького закону.'
  - 'Збори: 90 € для дорослого і 45 € для дитини 6–12 років зі spec §5 не знайдені в тарифі 145/1995 і лишаються непідтвердженими. Підтверджені лише 90 € за візу на прикордонному переході і 45 € за продовження короткострокової візи (položka 26).'
  - 'Розрахунок 90/180 днів (маршрут A2 таксономії) не описаний — це право ЄС.'
  - 'Умови в''їзду за §6 і відмова у в''їзді за §11 не описані.'
