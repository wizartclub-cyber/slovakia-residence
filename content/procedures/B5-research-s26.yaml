steps:
  - id: s1-hosting
    order: 1
    title:
      uk: Угода про гостювання — основа маршруту
      sk: Dohoda o hosťovaní je základom tejto cesty
    body:
      uk: >-
        Мета доводиться угодою про гостювання за окремим приписом (§32 ods. 5 písm. m). Строк пробуту дорівнює строку угоди, максимум два роки.
      sk: >-
        Účel sa preukazuje dohodou o hosťovaní podľa osobitného predpisu (§32 ods. 5 písm. m). Pobyt sa udelí na čas platnosti dohody, najviac na dva roky.
    afterDecision: false
    prerequisites: []
    sourceIds: [slovlex-404-2011]
  - id: s2-90-days
    order: 2
    title:
      uk: Перші 90 днів пробут може не вимагатися
      sk: Prvých 90 dní sa pobyt nemusí vyžadovať
    body:
      uk: >-
        §26 ods. 2: пробут на дослідження не вимагається протягом 90 днів від початку перебування, якщо особа виконує умови за окремим приписом і обовязок за §111 ods. 2 písm. a).
      sk: >-
        §26 ods. 2: pobyt sa nevyžaduje do 90 dní od začiatku pobytu, ak osoba spĺňa podmienky podľa osobitného predpisu a povinnosť podľa §111 ods. 2 písm. a).
    afterDecision: false
    prerequisites: []
    sourceIds: [slovlex-404-2011]
  - id: s3-no-accommodation
    order: 3
    title:
      uk: Документ про житло не потрібен
      sk: Doklad o ubytovaní sa nevyžaduje
    body:
      uk: >-
        §32 ods. 2 písm. e) bod 5 звільняє заявників за §26 від документа про забезпечення житлом. Після рішення діють обовязки: страхування і медичний висновок протягом 30 днів.
      sk: >-
        §32 ods. 2 písm. e) bod 5 oslobodzuje žiadateľov podľa §26 od dokladu o ubytovaní. Po rozhodnutí platia povinnosti: poistenie a lekársky posudok do 30 dní.
    afterDecision: false
    prerequisites: []
    sourceIds: [slovlex-404-2011]
