grantedFor:
  uk: >-
    На час чинності угоди про гостювання (dohoda o hosťovaní), але не більше ніж на два роки (§26 ods. 1). Особа з таким пробутом може займатися підприємництвом.
  sk: >-
    Na čas platnosti dohody o hosťovaní, najviac však na dva roky (§26 ods. 1). Osoba s týmto pobytom môže podnikať.
