openQuestions:
  - 'Збору за цю мету в položci 24 тарифу немає — перевірити, чи вона входить в інший підпункт.'
  - 'Мобільність дослідника (§36c) окремим маршрутом не описана.'
  - 'Після дослідження можна просити обновлення на дев''ять місяців для пошуку роботи або початку підприємництва (§34 ods. 1 písm. b) — див. маршрут обновлення.'
