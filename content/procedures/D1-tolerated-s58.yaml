# Наповнено з тексту §58 (снапшот slovlex-404-2011).
id: D1-tolerated-s58
category: D
title:
  uk: Толероване перебування (§58)
  sk: Tolerovaný pobyt (§58)
legalBasis:
  - '404/2011 §58'
  - '404/2011 §59 ods. 12'
validFrom: '2026-07-15'
validTo: null
reviewStatus: draft
reviewedAt: null
reviewer: null
sourceIds:
  - slovlex-404-2011
conditionsComplete: false
grantedFor:
  uk: >-
    Для нелегально працевлаштованих в особливо експлуататорських умовах —
    180 днів із можливістю повторного продовження на 180 днів, аж до
    остаточного завершення кримінального провадження або поки не буде виплачено
    заборговану винагороду (§58 ods. 2). Для жертв торгівлі людьми окремо
    діє строк до 90 днів на роздуми, який можна продовжити на 30 днів
    (§58 ods. 3).
  sk: >-
    Pri nelegálnom zamestnaní za osobitne vykorisťujúcich podmienok 180 dní
    s opakovaným predĺžením o 180 dní až do právoplatného skončenia trestného
    konania alebo úhrady dlžnej odmeny (§58 ods. 2). Pri obetiach obchodovania
    s ľuďmi lehota na rozhodnutie do 90 dní, predĺžiteľná o 30 dní (§58 ods. 3).
decisionDeadline: null
eligibilityRules:
  # Особа з тимчасовим захистом — теж громадянин третьої країни за законом,
  # тому цей маршрут для неї не закритий. Там, де закон її виключає
  # (наприклад §52 ods. 2 písm. e), для цього є окреме правило exclude.
