steps:
  - id: s1-grounds
    order: 1
    title:
      uk: Чотири підстави, за яких поліція надає толероване перебування
      sk: Štyri dôvody, pri ktorých policajný útvar udelí tolerovaný pobyt
    body:
      uk: >-
        §58 ods. 1: (a) неповнолітня особа, знайдена на території Словаччини;
        (b) якщо цього вимагає повага до приватного і сімейного життя і це не
        загрожує безпеці держави чи публічному порядку — для осіб за §27 ods. 1
        і §43 ods. 1 písm. a) až d) лише тоді, коли вони не мають дійсного
        проїзного документа і достовірно доводять свою особу інакше;
        (c) жертва торгівлі людьми віком від 18 років; (d) якщо це випливає з
        міжнародних зобов'язань Словаччини.
      sk: >-
        §58 ods. 1: (a) maloletá osoba nájdená na území SR; (b) ak to vyžaduje
        rešpektovanie súkromného a rodinného života a neohrozuje to bezpečnosť
        štátu ani verejný poriadok; (c) obeť obchodovania s ľuďmi od 18 rokov;
        (d) ak to vyplýva z medzinárodných záväzkov SR.
    afterDecision: false
    prerequisites: []
    sourceIds: [slovlex-404-2011]
  - id: s2-exploited-work
    order: 2
    title:
      uk: Окремий шлях для нелегально працевлаштованих
      sk: Osobitná cesta pri nelegálnom zamestnaní
    body:
      uk: >-
        §58 ods. 2: за заявою органу, що веде кримінальне провадження, толероване
        перебування може отримати особа, яку нелегально працевлаштували в
        особливо експлуататорських умовах, або нелегально працевлаштована
        неповнолітня особа, якщо її присутність потрібна для кримінального
        провадження. Орган або вповноважена міністерством особа зобов'язані
        пояснити людині цю можливість, її умови, права й обов'язки.
      sk: >-
        §58 ods. 2: na žiadosť orgánu činného v trestnom konaní môže tolerovaný
        pobyt získať osoba nelegálne zamestnaná za osobitne vykorisťujúcich
        podmienok alebo nelegálne zamestnaná maloletá osoba, ak je jej prítomnosť
        potrebná na trestné konanie.
    afterDecision: false
    prerequisites: []
    sourceIds: [slovlex-404-2011]
  - id: s3-fee
    order: 3
    title:
      uk: За частиною підстав збір не стягується
      sk: Pri časti dôvodov sa poplatok neplatí
    body:
      uk: >-
        Тариф 145/1995, положка 24, Oslobodenie 7: від зборів за підпунктами h)
        і i) (140 € і 50 €) звільнені ті, хто просить толероване перебування за
        §58 ods. 1 písm. a) і c) та за §58 ods. 2 — тобто знайдені неповнолітні,
        жертви торгівлі людьми і нелегально працевлаштовані в експлуататорських
        умовах. Окремо звільнені всі, молодші за 18 років (Oslobodenie 3).
      sk: >-
        Sadzobník 145/1995, položka 24, Oslobodenie 7: od poplatkov podľa písmen
        h) a i) sú oslobodené osoby žiadajúce o tolerovaný pobyt podľa §58 ods. 1
        písm. a) a c) a ods. 2. Osobitne sú oslobodené osoby mladšie ako 18 rokov.
    afterDecision: false
    prerequisites: []
    sourceIds: [slovlex-145-1995]
  - id: s4-how-to-apply
    order: 4
    title:
      uk: Хто подає заяву і на який строк дають
      sk: Kto podáva žiadosť a na aký čas sa udeľuje
    body:
      uk: >-
        §59 ods. 1: пробут надають або продовжують на час тривання підстав, але
        не більше ніж на 180 днів. Заява подається ОСОБИСТО на офіційному бланку
        в поліції. За жертву торгівлі людьми (§58 ods. 1 písm. c) і за
        нелегально працевлаштовану особу (§58 ods. 2) заяву подає орган, що веде
        кримінальне провадження. За того, хто через безпорадність не може подати
        заяву сам, це може зробити член родини або вповноважена ним особа; за
        неповнолітнього без супроводу без опікуна — орган соціально-правового
        захисту дітей.
      sk: >-
        §59 ods. 1: pobyt sa udelí alebo predĺži na čas trvania dôvodov, najviac
        na 180 dní. Žiadosť sa podáva OSOBNE na úradnom tlačive na polícii; za obeť
        obchodovania s ľuďmi a nelegálne zamestnanú osobu ju podáva orgán činný
        v trestnom konaní.
    afterDecision: false
    prerequisites: []
    sourceIds: [slovlex-404-2011]
  - id: s5-stay-during-procedure
    order: 5
    title:
      uk: Доки триває розгляд, ви маєте право лишатися в Словаччині
      sk: Počas konania máte právo zdržiavať sa na území SR
    body:
      uk: >-
        §59 ods. 14: хто попросив про надання або продовження толерованого
        перебування, має право перебувати на території Словаччини аж до рішення
        за цією заявою. Окремо §59 ods. 15: підтвердження про толероване
        перебування з назвою «DOČASNÉ ÚTOČISKO», видане тому, хто просив
        тимчасового захисту, чинне 90 днів від видачі.
      sk: >-
        §59 ods. 14: kto požiadal o udelenie alebo predĺženie tolerovaného pobytu,
        je oprávnený zdržiavať sa na území SR až do rozhodnutia. Potvrdenie
        s názvom „DOČASNÉ ÚTOČISKO“ platí 90 dní od vydania (ods. 15).
    afterDecision: false
    prerequisites: [s4-how-to-apply]
    sourceIds: [slovlex-404-2011]
  - id: s6-refusal
    order: 6
    title:
      uk: Чотири підстави для відмови — і виняток для найвразливіших
      sk: Štyri dôvody zamietnutia — a výnimka pre najzraniteľnejších
    body:
      uk: >-
        §59 ods. 12: відмовлять, якщо людина подала неправдиві чи оманливі дані
        або підроблені чи чужі документи; якщо не виконує умов; якщо є небажаною
        особою; або якщо не додала документа за ods. 3. АЛЕ §59 ods. 13 прямо
        каже: перша і третя підстави НЕ застосовуються до знайдених неповнолітніх
        (§58 ods. 1 písm. a) і жертв торгівлі людьми (písm. c).
      sk: >-
        §59 ods. 12: zamietnu pri nepravdivých údajoch alebo falošných dokladoch,
        pri nesplnení podmienok, pri nežiaducej osobe a pri chýbajúcom doklade.
        §59 ods. 13 však vylučuje prvý a tretí dôvod pri §58 ods. 1 písm. a) a c).
    afterDecision: false
    prerequisites: []
    sourceIds: [slovlex-404-2011]
