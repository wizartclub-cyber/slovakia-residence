openQuestions:
  - 'Опитувальник не питає про обставини, які тут вирішальні (знайдена неповнолітня особа, жертва торгівлі людьми, нелегальна експлуатація), тому маршрут показується всім громадянам третіх країн без чинного пробуту. Це навмисно широко: краще показати зайве, ніж сховати шлях від людини у складній ситуації.'
  - 'Підстави відмови за §59 ods. 12 внесені кроком 6; решта §59 (ods. 2–11) не прочитана.'
  - 'Права й обов''язки під час толерованого перебування (§59 і далі) не описані.'
  - 'Продовження толерованого перебування описане лише в частині строків.'
