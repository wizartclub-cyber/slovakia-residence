  - 'Підстави припинення (§37) і відібрання (§38) додаткового захисту не описані.'
  - 'Права за §57 (допомога особам із захистом) не описані.'
  - 'Прочитано §31, §33, §34 і §48; решта закону 69/2026 — ні.'
