openQuestions:
  - 'Розмір середньої місячної зарплати в економіці СР не внесений: джерела Статистичного управління в реєстрі немає, а вигадувати суму не можна.'
  - 'Підстави відмови за §39 ods. 1 не внесені.'
  - 'Умови подання заяви за §38 прочитані лише частково.'
  - 'Мобільність власника синьої карти між державами-членами (§40, §41) не описана.'
  - 'Власники синьої карти мають окрему гілку для довгострокового пробуту за §52 ods. 1 písm. c) — два роки як власник карти.'
