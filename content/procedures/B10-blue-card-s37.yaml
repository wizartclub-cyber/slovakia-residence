steps:
  - id: s1-what-it-gives
    order: 1
    title:
      uk: Що дає синя карта
      sk: Čo modrá karta umožňuje
    body:
      uk: >-
        §37 ods. 1: право в'їхати, перебувати, виконувати високваліфіковану
        роботу в Словаччині, виїжджати з країни й повертатися протягом строку
        чинності карти.
      sk: >-
        §37 ods. 1: právo vstúpiť, zdržiavať sa, vykonávať vysokokvalifikované
        zamestnanie na území SR, vycestovať a opätovne vstúpiť počas platnosti karty.
    afterDecision: false
    prerequisites: []
    sourceIds: [slovlex-404-2011]
  - id: s2-salary
    order: 2
    title:
      uk: Поріг зарплати прив'язаний до середньої зарплати в економіці
      sk: Mzdový prah je viazaný na priemernú mzdu v hospodárstve
    body:
      uk: >-
        §37 ods. 3: високваліфікована робота — та, для якої потрібна вища
        фахова кваліфікація і за яку належить місячна зарплата щонайменше
        1,2-кратного розміру середньої місячної зарплати працівника в економіці
        Словаччини, оприлюдненої Статистичним управлінням за календарний рік
        перед роком подання заяви (для окремих випадків — розміру самої
        середньої зарплати). Конкретної суми ми не наводимо: її оприлюднює
        Статистичне управління, і цього джерела в нашому реєстрі поки немає.
      sk: >-
        §37 ods. 3: vysokokvalifikované zamestnanie vyžaduje vyššiu odbornú
        kvalifikáciu a mesačnú mzdu najmenej 1,2-násobku priemernej mesačnej mzdy
        v hospodárstve SR zverejnenej Štatistickým úradom za predchádzajúci
        kalendárny rok. Konkrétnu sumu neuvádzame — zdroj zatiaľ nie je v registri.
    afterDecision: false
    prerequisites: []
    sourceIds: [slovlex-404-2011]
  - id: s3-vacancy
    order: 3
    title:
      uk: Потрібне підтвердження про робоче місце, що відповідає високій кваліфікації
      sk: Potrebné je potvrdenie o pracovnom mieste zodpovedajúcom kvalifikácii
    body:
      uk: >-
        Підтвердження про можливість заповнення вільного робочого місця має
        відповідати саме високваліфікованій роботі (§37 ods. 2). Видає його
        управління праці; сторінка ÚPSVaR про синю карту в нашому реєстрі
        позначена як застаріліша за зміни від 15.07.2026.
      sk: >-
        Potvrdenie o možnosti obsadenia voľného pracovného miesta musí zodpovedať
        vysokokvalifikovanému zamestnaniu (§37 ods. 2). Stránka ÚPSVaR o modrej
        karte je v našom registri označená ako staršia než zmeny od 15.07.2026.
    afterDecision: false
    prerequisites: []
    sourceIds: [slovlex-404-2011, upsvr-blue-card-guidance]
