# Наповнено з тексту §37 (снапшот slovlex-404-2011).
id: B10-blue-card-s37
category: B
title:
  uk: Синя карта ЄС — високваліфікована робота (§37)
  sk: Modrá karta EÚ — vysokokvalifikované zamestnanie (§37)
legalBasis:
  - '404/2011 §37'
  - '404/2011 §38'
  - '404/2011 §39 ods. 1'
validFrom: '2026-07-15'
validTo: null
reviewStatus: draft
reviewedAt: null
reviewer: null
sourceIds:
  - slovlex-404-2011
  - upsvr-blue-card-guidance
conditionsComplete: false
grantedFor:
  uk: >-
    На п'ять років. Якщо підтвердження про можливість заповнення вільного
    робочого місця чинне менше ніж п'ять років, карту надають на строк цього
    підтвердження плюс 90 днів, але загалом не більше ніж на п'ять років
    (§37 ods. 2).
  sk: >-
    Na päť rokov. Ak je potvrdenie o možnosti obsadenia voľného pracovného miesta
    platné kratšie, karta sa udelí na čas jeho platnosti predĺžený o 90 dní,
    najviac však na päť rokov (§37 ods. 2).
decisionDeadline: null
eligibilityRules:
  # Особа з тимчасовим захистом — теж громадянин третьої країни за законом,
  # тому цей маршрут для неї не закритий. Там, де закон її виключає
  # (наприклад §52 ods. 2 písm. e), для цього є окреме правило exclude.
  - id: r-third-country
    effect: require
    when: { field: citizenshipGroup, in: [third_country, ua_temporary_protection] }
    localizedContentKey: null
    sourceIds: [slovlex-404-2011]
  - id: r-purpose-employment
    effect: require
    when: { field: purpose, equals: employment }
    localizedContentKey: null
    sourceIds: [slovlex-404-2011]
