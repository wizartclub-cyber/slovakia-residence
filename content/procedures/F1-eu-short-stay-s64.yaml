# Наповнено з тексту §64 (снапшот slovlex-404-2011).
id: F1-eu-short-stay-s64
category: F
title:
  uk: Громадянин ЄС — перебування до трьох місяців (§64)
  sk: Občan Únie — pobyt do troch mesiacov (§64)
legalBasis:
  - '404/2011 §64'
validFrom: '2026-07-15'
validTo: null
reviewStatus: draft
reviewedAt: null
reviewer: null
sourceIds: [slovlex-404-2011]
conditionsComplete: false
grantedFor:
  uk: >-
    Три місяці від дня в'їзду, без жодних додаткових умов і формальностей —
    достатньо дійсного посвідчення особи або проїзного документа (§64 ods. 1).
    Замість них можна подати будь-який інший документ, яким людина достовірно
    доведе поліції свою особу і громадянство держави-члена.
  sk: >-
    Tri mesiace odo dňa vstupu bez ďalších podmienok a formalít — stačí platný
    preukaz totožnosti alebo cestovný doklad (§64 ods. 1).
decisionDeadline: null
