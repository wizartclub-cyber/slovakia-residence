# Умови придатності НЕ повні: §33 ods. 6 містить підстави для відмови, які ще не
# внесені, тому conditionsComplete лишається false і сайт не каже «підходить».
id: B2-employment-s23
category: B
title:
  uk: Тимчасове проживання — працевлаштування (§23)
  sk: Prechodný pobyt na účel zamestnania (§23)
legalBasis:
  - '404/2011 §23'
  - '404/2011 §32'
  - '404/2011 §33 ods. 8'
validFrom: '2026-07-15'
validTo: null
reviewStatus: draft
reviewedAt: null
reviewer: null
sourceIds:
  - slovlex-404-2011
  - mzv-residence-master-guidance
conditionsComplete: false
grantedFor:
  uk: >-
    На передбачуваний час зайнятості, але не більше ніж на п'ять років
    (§23 ods. 3). Сезонна зайнятість — не більше 240 днів протягом 12 місяців
    поспіль (§23 ods. 4).
  sk: >-
    Na predpokladaný čas zamestnania, najviac však na päť rokov (§23 ods. 3).
    Sezónne zamestnanie najviac na 240 dní počas 12 po sebe nasledujúcich
    mesiacov (§23 ods. 4).
decisionDeadline:
  uk: >-
    60 днів від дня надходження заяви з усіма додатками за §32 — для §23 ods. 1.
    30 днів, якщо йдеться про роботу за професією з нестачею робочої сили.
    Загальний строк для інших випадків — 90 днів (§33 ods. 8).
  sk: >-
    60 dní odo dňa doručenia žiadosti so všetkými náležitosťami podľa §32 pri
    §23 ods. 1. 30 dní, ak ide o zamestnanie s nedostatkom pracovnej sily.
    Všeobecná lehota 90 dní (§33 ods. 8).
