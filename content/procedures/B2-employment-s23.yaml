openQuestions:
  - 'Підстави для відмови за §33 ods. 6 не внесені як умови — доки їх немає, перелік умов неповний.'
  - 'Гілка §23 ods. 2 (дозвіл на роботу або підтвердження роботодавця) описана документом work-permit, але окремим маршрутом не виділена.'
  - 'Гілка §21b(4)(f) Act 5/2004 після національної візи не перевірена — джерело slovlex-5-2004 без URL.'
  - 'Обов''язок медичного страхування §32 ods. 9 стосується §22, §25, §26, §27 і §30 — §23 у переліку немає; варто підтвердити в юриста.'
  - 'Вимоги до перекладу та легалізації іноземних документів у §32 не знайдені — перевірити за іншими нормами.'
