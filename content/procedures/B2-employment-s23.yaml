steps:
  - id: s1-vacancy
    order: 1
    title:
      uk: Роботодавець отримує підтвердження про можливість заповнення місця
      sk: Zamestnávateľ získa potvrdenie o možnosti obsadenia pracovného miesta
    body:
      uk: >-
        Підтвердження видає управління праці (ÚPSVaR) і надсилає безпосередньо в
        поліцію або на закордонну установу. Без нього заяву за §23 ods. 1 не
        приймуть. Від видачі підтвердження до подання заяви має минути не більше
        180 днів (§32 ods. 1).
      sk: >-
        Potvrdenie vydáva úrad práce a doručuje ho priamo policajnému útvaru alebo
        zastupiteľskému úradu. Bez neho žiadosť podľa §23 ods. 1 neprijmú. Od jeho
        vydania nesmie uplynúť viac ako 180 dní (§32 ods. 1).
    afterDecision: false
    prerequisites: []
    sourceIds: [slovlex-404-2011]
  - id: s2-form
    order: 2
    title:
      uk: Заповнити офіційний бланк словацькою мовою
      sk: Vyplniť úradné tlačivo v slovenskom jazyku
    body:
      uk: >-
        Заява подається на офіційному бланку (§32 ods. 1). Бланк T MV SR 11-057
        за власною інструкцією заповнюється словацькою, друкованими літерами.
      sk: >-
        Žiadosť sa podáva na úradnom tlačive (§32 ods. 1). Tlačivo T MV SR 11-057
        sa podľa vlastného pokynu vypĺňa v slovenčine, paličkovým písmom.
    afterDecision: false
    prerequisites: []
    sourceIds: [slovlex-404-2011, mzv-form-11-057]
  - id: s3-documents
    order: 3
    title:
      uk: Зібрати додатки, не старші за 90 днів
      sk: Zhromaždiť náležitosti nie staršie ako 90 dní
    body:
      uk: >-
        Для §23 ods. 1 мету перебування окремо доводити не треба — її замінює
        підтвердження від управління праці (§32 ods. 2 písm. a). Потрібні
        несудимість і забезпечення житлом, окрім винятків із §32 ods. 2 písm. e).
      sk: >-
        Pri §23 ods. 1 sa účel pobytu osobitne nepreukazuje — nahrádza ho potvrdenie
        úradu práce (§32 ods. 2 písm. a). Vyžaduje sa bezúhonnosť a zabezpečenie
        ubytovania, okrem výnimiek podľa §32 ods. 2 písm. e).
    afterDecision: false
    prerequisites: [s1-vacancy]
    sourceIds: [slovlex-404-2011]
  - id: s4-submit
    order: 4
    title:
      uk: Подати заяву разом із дійсним проїзним документом
      sk: Podať žiadosť spolu s platným cestovným dokladom
    body:
      uk: >-
        Заяву приймають на закордонній установі або в поліції. Якщо чогось бракує,
        орган зобов'язаний письмово повідомити, які документи треба донести, щоб
        заяву прийняли (§32 ods. 1).
      sk: >-
        Žiadosť prijíma zastupiteľský úrad alebo policajný útvar. Ak niečo chýba,
        orgán je povinný písomne oznámiť, ktoré doklady treba doložiť, aby žiadosť
        prijal (§32 ods. 1).
    afterDecision: false
    prerequisites: [s2-form, s3-documents]
    sourceIds: [slovlex-404-2011]
  - id: s5-decision
    order: 5
    title:
      uk: Рішення органу
      sk: Rozhodnutie orgánu
    body:
      uk: >-
        60 днів для §23 ods. 1, 30 днів для професій із нестачею робочої сили
        (§33 ods. 8). Поліція враховує публічний інтерес, безпеку, господарські
        інтереси, інтереси дитини, особисті та родинні обставини (§33 ods. 1).
      sk: >-
        60 dní pri §23 ods. 1, 30 dní pri zamestnaní s nedostatkom pracovnej sily
        (§33 ods. 8). Policajný útvar prihliada na verejný záujem, bezpečnosť,
        hospodárske záujmy, záujmy dieťaťa a rodinné pomery (§33 ods. 1).
    afterDecision: false
    prerequisites: [s4-submit]
    sourceIds: [slovlex-404-2011]
  - id: s6-medical
    order: 6
    title:
      uk: Протягом 30 днів після картки — медичний висновок
      sk: Do 30 dní od prevzatia dokladu — lekársky posudok
    body:
      uk: >-
        Після отримання картки проживання треба здати в поліцію медичний висновок
        про відсутність хвороби, небезпечної для здоров'я населення. Сам висновок
        не старший за 30 днів; строк подання можна продовжити на 60 днів
        (§32 ods. 10).
      sk: >-
        Po prevzatí dokladu o pobyte treba odovzdať policajnému útvaru lekársky
        posudok, že netrpíte chorobou ohrozujúcou verejné zdravie. Posudok nesmie
        byť starší ako 30 dní; lehotu možno predĺžiť o 60 dní (§32 ods. 10).
    afterDecision: true
    prerequisites: [s5-decision]
    sourceIds: [slovlex-404-2011]
  - id: s7-ict
    order: 7
    title:
      uk: Внутрішньокорпоративний переказ — окремі строки
      sk: Vnútropodnikový presun — osobitné lehoty
    body:
      uk: >-
        §23 ods. 5: якщо йдеться про внутрішньокорпоративний переказ, пробут
        можуть надати не більше ніж на три роки керівному працівникові або
        фахівцеві і не більше ніж на один рік працівникові-стажисту. У картці
        проживання в полі «вид пробуту» проставлять «ICT» (§73 ods. 5).
      sk: >-
        §23 ods. 5: pri vnútropodnikovom presune sa pobyt udelí najviac na tri roky
        vedúcemu zamestnancovi alebo odborníkovi a najviac na jeden rok
        zamestnancovi – stážistovi. V doklade sa uvedie „ICT“ (§73 ods. 5).
    afterDecision: false
    prerequisites: []
    sourceIds: [slovlex-404-2011]
  - id: s8-no-permit-90-days
    order: 8
    title:
      uk: Сім випадків, коли перші 90 днів пробут не потрібен
      sk: Sedem prípadov, keď sa prvých 90 dní pobyt nevyžaduje
    body:
      uk: >-
        §23 ods. 6: пробут на працевлаштування не вимагається протягом 90 днів
        від початку перебування, якщо людина виконує умови перебування за окремим
        приписом, виконала обов'язок за §111 ods. 2 písm. a) і при цьому:
        (a) працює для значного іноземного інвестора в Словаччині; (b) відряджена
        роботодавцем із держави-члена в межах надання послуг; (c) зайнята в
        міжнародних перевезеннях і відряджена своїм закордонним роботодавцем;
        (d) за торговим договором забезпечує постачання товару чи послуг і
        виконує монтаж, гарантійні та ремонтні роботи, налаштування систем,
        програмування або фахові навчання, якщо відрядження загалом не перевищує
        90 днів на рік; (e) те саме для компанії, якій надано інвестиційну
        допомогу, на строк рішення про її схвалення; (f) виконує сезонну
        зайнятість; (g) проводить фахові навчання для центру підприємницьких
        послуг, якщо трудові відносини не перевищують 90 днів у календарному році.
      sk: >-
        §23 ods. 6: pobyt na účel zamestnania sa nevyžaduje do 90 dní od začiatku
        pobytu v siedmich prípadoch — práca pre významného zahraničného investora,
        vyslanie zamestnávateľom z členského štátu, medzinárodná doprava, dodávky
        tovaru a služieb do 90 dní v roku, dodávky pre spoločnosť s investičnou
        pomocou, sezónne zamestnanie a odborné školenia pre centrum podnikových
        služieb do 90 dní.
    afterDecision: false
    prerequisites: []
    sourceIds: [slovlex-404-2011]
