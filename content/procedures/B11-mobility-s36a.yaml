conditionsComplete: false
grantedFor:
  uk: >-
    Тут нічого не «надають»: пробут просто НЕ ВИМАГАЄТЬСЯ. Для студента вищої
    школи — до 360 днів від початку перебування (§36b), для дослідника — до
    одного року (§36c), для внутрішньокорпоративного переказу — на час
    погодженої мобільності (§36a).
  sk: >-
    Nič sa tu neudeľuje: pobyt sa jednoducho NEVYŽADUJE. Pri študentovi do 360 dní
    (§36b), pri výskumníkovi do jedného roka (§36c), pri vnútropodnikovom presune
    počas schválenej mobility (§36a).
