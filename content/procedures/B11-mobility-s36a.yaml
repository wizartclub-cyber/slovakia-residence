steps:
  - id: s1-principle
    order: 1
    title:
      uk: 'Головний принцип: повідомляє приймаюча сторона, а не ви'
      sk: Hlavná zásada - oznamuje hostiteľský subjekt, nie vy
    body:
      uk: >-
        В усіх чотирьох випадках пробут не вимагається за умови, що приймаюча
        сторона в Словаччині або в державі-члені ПОВІДОМИЛА міністерство
        внутрішніх справ про намір скористатися мобільністю ДО вашого приїзду,
        міністерство не заперечило, і ви не становите загрози безпеці держави,
        публічному порядку чи публічному здоров'ю.
      sk: >-
        Vo všetkých štyroch prípadoch sa pobyt nevyžaduje, ak hostiteľský subjekt
        oznámil ministerstvu vnútra úmysel uplatňovať mobilitu PRED príchodom,
        ministerstvo nevznieslo námietku a osoba nepredstavuje hrozbu.
    afterDecision: false
    prerequisites: []
    sourceIds: [slovlex-404-2011]
  - id: s2-ict
    order: 2
    title:
      uk: Внутрішньокорпоративний переказ (§36a)
      sk: Vnútropodnikový presun (§36a)
    body:
      uk: >-
        Потрібен чинний документ про пробут іншої держави-члена з позначкою «ICT»
        у полі «вид пробуту», і мобільність має відбуватися в того самого
        роботодавця або в межах тієї самої групи роботодавців, де переказ
        схвалено. Разом із повідомленням приймаюча сторона надсилає доказ
        належності до тієї самої групи, документ про виконання умов регульованої
        професії (якщо вона регульована), чинний проїзний документ і дати початку
        та кінця мобільності.
      sk: >-
        Potrebný je platný doklad o pobyte iného členského štátu s označením „ICT“
        a mobilita musí prebiehať u toho istého zamestnávateľa alebo v tej istej
        skupine. K oznámeniu sa prikladá doklad o príslušnosti k skupine, doklad
        o regulovanom povolaní, cestovný doklad a dátumy mobility.
    afterDecision: false
    prerequisites: [s1-principle]
    sourceIds: [slovlex-404-2011]
  - id: s3-student
    order: 3
    title:
      uk: Студент вищої школи (§36b) — до 360 днів
      sk: Študent vysokej školy (§36b) — do 360 dní
    body:
      uk: >-
        Потрібен чинний документ про пробут іншої держави-члена для навчання у
        вищій школі. Словацька вища школа надсилає повідомлення і докази того, що
        частина навчання відбувається в межах програми ЄС, урядової чи
        багатосторонньої програми або угоди між вишами, а також підтвердження про
        прийняття на навчання, документ про пробут, проїзний документ і дати.
        Додатково потрібно, щоб сплив строк, у який міністерство могло заперечити.
      sk: >-
        Potrebný je platný doklad o pobyte iného členského štátu na účel štúdia.
        Vysoká škola v SR zašle oznámenie s dokladmi o programe mobility, prijatí
        na štúdium, doklade o pobyte, cestovnom doklade a dátumoch.
    afterDecision: false
    prerequisites: [s1-principle]
    sourceIds: [slovlex-404-2011]
  - id: s4-researcher
    order: 4
    title:
      uk: Дослідник (§36c) — до одного року
      sk: Výskumný pracovník (§36c) — do jedného roka
    body:
      uk: >-
        Потрібен чинний документ про пробут іншої держави-члена для наукової
        діяльності; повідомляє дослідницька організація в Словаччині, у якій
        відбуватиметься мобільність.
      sk: >-
        Potrebný je platný doklad o pobyte iného členského štátu na účel výskumnej
        činnosti; oznamuje výskumná organizácia v SR.
    afterDecision: false
    prerequisites: [s1-principle]
    sourceIds: [slovlex-404-2011]
  - id: s5-family
    order: 5
    title:
      uk: Член родини (§36d) — доки мобільність триває
      sk: Rodinný príslušník (§36d) — kým mobilita trvá
    body:
      uk: >-
        Членові родини особи за §36a або §36c пробут за §27 ods. 1 písm. a) не
        вимагається протягом усього часу, поки та особа користується мобільністю
        в Словаччині. Потрібен чинний документ про пробут іншої держави-члена в
        єдиному форматі, і повідомлення надсилає та сама приймаюча сторона або
        дослідницька організація.
      sk: >-
        Rodinnému príslušníkovi osoby podľa §36a alebo §36c sa pobyt nevyžaduje
        počas obdobia, keď táto osoba uplatňuje mobilitu na území SR.
    afterDecision: false
    prerequisites: [s1-principle]
    sourceIds: [slovlex-404-2011]
