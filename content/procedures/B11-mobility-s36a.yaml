# Наповнено з тексту §36a–§36d (снапшот slovlex-404-2011).
id: B11-mobility-s36a
category: B
title:
  uk: Мобільність із дозволу іншої держави ЄС (§36a–§36d)
  sk: Mobilita z povolenia iného štátu EÚ (§36a–§36d)
legalBasis:
  - '404/2011 §36a'
  - '404/2011 §36b'
  - '404/2011 §36c'
  - '404/2011 §36d'
validFrom: '2026-07-15'
validTo: null
reviewStatus: draft
reviewedAt: null
