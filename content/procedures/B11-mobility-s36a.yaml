openQuestions:
  - 'Строк, у який міністерство може заперечити (§36a–§36c ods. 3), і наслідки заперечення не прочитані.'
  - 'Опитувальник не питає, чи маєте ви дозвіл іншої держави-члена саме на переказ, навчання чи дослідження — умова спрощена до наявності особливого статусу.'
  - 'Обов''язки приймаючої сторони і наслідки їх невиконання не описані.'
  - 'Мобільність власника синьої карти (§40, §41) описується окремо і тут не наведена.'
