# Шаблон маршруту. Один файл = один маршрут. Копіювати як <code>.yaml (напр. B2-employment-s23.yaml).
# Поля відповідають spec §7. Порожнє поле краще за вигадане.
id: B2-employment-s23
category: B            # A entry · B temporary · C permanent · D tolerated · E protection · F EU · G admin
title:
  uk: Тимчасове проживання (prechodný pobyt) — працевлаштування (§23)
  sk: Prechodný pobyt na účel zamestnania (§23)
legalBasis:
  - "404/2011 §23"
  - "5/2004 §21b"
validFrom: "2026-07-15"
validTo: null
reviewStatus: draft    # draft | source_verified | legally_reviewed | published | superseded | blocked
reviewedAt: null
reviewer: null         # заповнює юрист; без нього published-маршрут не збирається
# Поля "status" тут навмисно немає: бейдж «неповний маршрут» для користувача
# обчислюється з reviewStatus (див. publicStatus() у src/lib/content/schema.ts).
sourceIds:
  - slovlex-404-2011
  - mzv-residence-master-guidance

# Умови. effect: require — без цього маршрут не підходить; exclude — це його виключає.
# Дозволені значення полів: src/lib/rules/domain.ts (білд падає на описці).
# Мова умов: {field, equals} · {field, in: [...]} · {all: []} · {any: []} · {not: {}}
#            · {onOrAfter: "РРРР-ММ-ДД"} · {before: "РРРР-ММ-ДД"}
eligibilityRules:
  - id: third-country-national
    effect: require
    when: { field: citizenshipGroup, equals: third_country }
    localizedContentKey: proc.B2.rule.thirdCountry
    sourceIds: [slovlex-404-2011]
  - id: purpose-employment
    effect: require
    when: { field: purpose, equals: employment }
    localizedContentKey: proc.B2.rule.purpose
    sourceIds: [slovlex-404-2011]

# На який строк надають і скільки закон дає органу на рішення — обидва з тексту закону.
grantedFor:
  uk: На передбачуваний час зайнятості, максимум п'ять років (§23 ods. 3).
  sk: Na predpokladaný čas zamestnania, najviac päť rokov (§23 ods. 3).
decisionDeadline:
  uk: 60 днів від подання повної заяви (§33 ods. 8 písm. b).
  sk: 60 dní od podania úplnej žiadosti (§33 ods. 8 písm. b).
formSourceIds: [mzv-form-11-057]
authorityIds: [ocp-pz, zastupitelsky-urad]
feeRuleIds: [fee-tr-employment-first]
# Документи описані у власних файлах content/documents/*.yaml і лише
# перелічуються тут — той самий документ трапляється в багатьох маршрутах.
documentIds: [travel-document, application-form]
# Юридичний текст кроків живе тут, у даних, а не в локалях (CLAUDE.md §4):
# юрист має правити його, не відкриваючи файли інтерфейсу.
steps:
  - id: s1
    order: 1
    title:
      uk: Що робить людина на цьому кроці
      sk: Čo žiadateľ na tomto kroku robí
    body:
      uk: Пояснення з посиланням на конкретний § закону.
      sk: Vysvetlenie s odkazom na konkrétny § zákona.
    afterDecision: false    # true — якщо це обов'язок ПІСЛЯ рішення
    prerequisites: []
    sourceIds: [slovlex-404-2011]

# Перехідні правила: спрацьовують додатково і додають попередження до маршруту.
transitionRules: []
relatedProcedureIds: [A3-national-visa-120]
openQuestions:
  - "Підтвердити гілку §21b(4)(f) Act 5/2004 після національної візи — джерело: пінована темпоральна версія 5/2004"
