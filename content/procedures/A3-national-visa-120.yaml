# Наповнено з тексту §15 (снапшот slovlex-404-2011).
id: A3-national-visa-120
category: A
title:
  uk: Національна віза на 120 днів для подачі заяви про проживання в СР (§15)
  sk: Národné vízum na 120 dní na podanie žiadosti o pobyt v SR (§15)
legalBasis:
  - '404/2011 §15 ods. 1 písm. b)'
  - '404/2011 §15 ods. 3 písm. a)'
validFrom: '2026-07-15'
validTo: null
reviewStatus: draft
reviewedAt: null
reviewer: null
sourceIds:
  - slovlex-404-2011
  - mzv-national-visa-guidance
conditionsComplete: false
grantedFor:
  uk: >-
    Національна віза надається на перебування довше за три місяці, максимум на
    один рік. Для випадків, пов'язаних із наданим пробутом або з подачею заяви
    про пробут, — на 120 днів (§15 ods. 3 písm. a).
  sk: >-
    Národné vízum sa udeľuje na pobyt dlhší ako tri mesiace, najviac na jeden rok.
    Pri prípadoch súvisiacich s udeleným pobytom alebo s podaním žiadosti o pobyt
    na 120 dní (§15 ods. 3 písm. a).
decisionDeadline: null
eligibilityRules:
  - id: r-third-country
    effect: require
    when: { field: citizenshipGroup, equals: third_country }
    localizedContentKey: null
    sourceIds: [slovlex-404-2011]
  - id: r-abroad
    effect: require
    when: { field: location, equals: abroad }
