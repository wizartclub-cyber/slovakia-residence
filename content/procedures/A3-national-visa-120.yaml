formSourceIds: [mzv-national-visa-sk, mzv-national-visa-en]
authorityIds: [zastupitelsky-urad]
feeRuleIds: []
documentIds: []
steps:
  - id: s1-purpose
    order: 1
    title:
      uk: Віза для подачі заяви про пробут — але НЕ для підприємництва
      sk: Vízum na podanie žiadosti o pobyt — ale NIE pri podnikaní
    body:
      uk: >-
        §15 ods. 1 písm. b) дозволяє національну візу, якщо вона потрібна у
        зв'язку з подачею заяви про пробут за цим законом, і прямо додає:
        це НЕ стосується заяви про тимчасове проживання за §22 (підприємництво).
        Окремо §15 ods. 1 písm. a) — віза у зв'язку з уже наданим пробутом.
      sk: >-
        §15 ods. 1 písm. b) umožňuje národné vízum, ak je potrebné v súvislosti
        s podaním žiadosti o pobyt podľa tohto zákona, a výslovne dodáva, že to
        neplatí pri žiadosti o prechodný pobyt podľa §22 (podnikanie). Osobitne
        §15 ods. 1 písm. a) — vízum v súvislosti s už udeleným pobytom.
    afterDecision: false
