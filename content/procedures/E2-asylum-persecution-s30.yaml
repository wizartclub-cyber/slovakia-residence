steps:
  - id: s1-persecution
    order: 1
    title:
      uk: Дві підстави для притулку через переслідування
      sk: Dva dôvody azylu z dôvodu prenasledovania
    body:
      uk: >-
        §30 ods. 1: міністерство внутрішніх справ надає притулок заявникові,
        якщо немає підстав для виключення за окремим приписом, і якщо він
        (a) виконує умови для визнання статусу біженця за окремим приписом або
        (b) у країні походження переслідується за здійснення політичних прав і
        свобод.
      sk: >-
        §30 ods. 1: ministerstvo vnútra udelí azyl, ak nie sú dôvody na vylúčenie,
        žiadateľovi, ktorý (a) spĺňa podmienky na priznanie postavenia utečenca
        alebo (b) je v krajine pôvodu prenasledovaný za uplatňovanie politických
        práv a slobôd.
    afterDecision: false
    prerequisites: []
    sourceIds: [slovlex-69-2026]
  - id: s2-family
    order: 2
    title:
      uk: Притулок для возз'єднання родини — три умови
      sk: Azyl na účel zlúčenia rodiny — tri podmienky
    body:
      uk: >-
        §32 ods. 2: (a) возз'єднання відбувається з особою, якій надано притулок
        через переслідування; (b) ця особа заздалегідь письмово погоджується на
        возз'єднання; (c) член родини не має в Словаччині наданого постійного
        проживання. Окремо §32 ods. 3: притулок надається також дитині,
        народженій особою з притулком на території Словаччини.
      sk: >-
        §32 ods. 2: (a) zlúčenie s azylantom, ktorému bol udelený azyl z dôvodu
        prenasledovania; (b) azylant so zlúčením vopred písomne súhlasí;
        (c) rodinný príslušník nemá v SR udelený trvalý pobyt. Podľa §32 ods. 3
        sa azyl udelí aj dieťaťu narodenému azylantke na území SR.
    afterDecision: false
    prerequisites: []
    sourceIds: [slovlex-69-2026]
  - id: s3-fee-link
    order: 3
    title:
      uk: Родина особи з притулком звільнена від збору за пробут
      sk: Rodina azylanta je oslobodená od poplatku za pobyt
    body:
      uk: >-
        Тариф 145/1995, положка 24, Oslobodenie 1: від зборів за першим поданням
        і обновленням тимчасового проживання звільнені ті, хто просить
        возз'єднання родини з особою, якій надано притулок, або з іноземцем із
        додатковим захистом.
      sk: >-
        Sadzobník 145/1995, položka 24, Oslobodenie 1: od poplatkov za prvé podanie
        a obnovenie prechodného pobytu sú oslobodené osoby žiadajúce zlúčenie
        rodiny s azylantom alebo s cudzincom s doplnkovou ochranou.
    afterDecision: false
    prerequisites: []
    sourceIds: [slovlex-145-1995]
