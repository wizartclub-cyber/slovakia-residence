steps:
  - id: s1-grounds
    order: 1
    title:
      uk: Перевірити, чи є у вас одна з двох підстав
      sk: Overiť, či máte jeden z dvoch dôvodov
    body:
      uk: >-
        §46 ods. 1 знає лише дві підстави: щонайменше чотири роки постійного
        проживання, наданого за §43, або дитина молодша за 18 років особи з
        постійним проживанням на необмежений час (зокрема передана їй в особисту
        опіку). Окремо §46 ods. 2 дозволяє Міністерству внутрішніх справ надати
        такий пробут поза цими умовами — за поданням спецслужб із міркувань
        безпеки держави.
      sk: >-
        §46 ods. 1 pozná len dva dôvody: najmenej štyri roky trvalého pobytu
        podľa §43, alebo dieťa mladšie ako 18 rokov osoby s trvalým pobytom na
        neobmedzený čas (aj zverené do osobnej starostlivosti). Osobitne §46
        ods. 2 umožňuje ministerstvu udeliť pobyt aj bez týchto podmienok.
