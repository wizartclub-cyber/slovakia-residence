openQuestions:
  - 'Підстави надання постійного проживання за §43 (перший, п''ятирічний пробут) ще не внесені окремим маршрутом — без нього умова «чотири роки за §43» не має куди вести.'
  - 'Підстави відмови за §48 ods. 2 не внесені.'
  - 'Перелік документів до заяви за §46 ще не прочитаний (окрема стаття).'
  - 'Опитувальник не питає, скільки років триває постійне проживання, тому умову «чотири роки» перевірити не може — показуємо маршрут як «варте уваги».'
