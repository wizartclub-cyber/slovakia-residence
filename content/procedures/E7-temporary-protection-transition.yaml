openQuestions:
  - 'Дата припинення тимчасового захисту в наших джерелах НЕ встановлена. Міністерство внутрішніх справ оголошувало продовження до 04.03.2027, але джерела цього оголошення в реєстрі немає. Доки захист триває, заяву за §131o подати не можна.'
  - 'Винятки §131o ods. 1 písm. a)–d) (звернення за міжнародним захистом, притулок в іншій державі-члені, безстроковий пробут в іншій державі, тимчасовий захист в іншій державі) не внесені як умови.'
  - 'Підстави відмови за §131o ods. 12 не внесені.'
  - 'Вказівка ÚHCP P PZ від 08.04.2026 про зарахування періодів тимчасового захисту до п''яти років для §52 не внесена — джерела немає. Водночас §52 ods. 2 písm. e) прямо виключає відідента; співвідношення цих двох правил має з''ясувати юрист.'
  - 'Збір за цю процедуру не встановлений.'
