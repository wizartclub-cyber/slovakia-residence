# Наповнено з тексту §34 (снапшот slovlex-404-2011).
id: G1-renewal-s34
category: G
title:
  uk: Обновлення тимчасового проживання (§34)
  sk: Obnovenie prechodného pobytu (§34)
legalBasis:
  - '404/2011 §34'
  - '404/2011 §33 ods. 8'
validFrom: '2026-07-15'
validTo: null
reviewStatus: draft
reviewedAt: null
reviewer: null
sourceIds:
  - slovlex-404-2011
conditionsComplete: false
grantedFor:
  uk: >-
    До трьох років, якщо передбачуваний пробут триватиме щонайменше три роки;
    до п'яти років для §23, §24 і §27, якщо пробут триватиме щонайменше п'ять
    років, а також для §29 і §30; дев'ять місяців випускникам і дослідникам
    (§24 ods. 1 písm. b) та §26), які після навчання чи дослідження хочуть
    лишитися шукати роботу або почати підприємництво; сезонна зайнятість —
    щоб разом не перевищити 240 днів за 12 місяців (§34 ods. 1).
  sk: >-
    Do troch rokov, ak predpokladaný pobyt potrvá najmenej tri roky; do piatich
    rokov pri §23, §24 a §27, ako aj pri §29 a §30; deväť mesiacov absolventom a
    výskumníkom, ktorí chcú zostať hľadať prácu alebo začať podnikať; pri sezónnom
    zamestnaní tak, aby sa spolu neprekročilo 240 dní za 12 mesiacov (§34 ods. 1).
decisionDeadline:
  uk: Ті самі строки, що й для першого подання (§34 ods. 14 із посиланням на §33 ods. 8).
  sk: Rovnaké lehoty ako pri prvom podaní (§34 ods. 14 s odkazom na §33 ods. 8).
eligibilityRules:
  # Особа з тимчасовим захистом — теж громадянин третьої країни за законом,
  # тому цей маршрут для неї не закритий. Там, де закон її виключає
  # (наприклад §52 ods. 2 písm. e), для цього є окреме правило exclude.
  - id: r-third-country
    effect: require
    when: { field: citizenshipGroup, in: [third_country, ua_temporary_protection] }
    localizedContentKey: null
    sourceIds: [slovlex-404-2011]
  - id: r-has-temporary-residence
    effect: require
    when: { field: currentStatus, equals: temporary_residence }
    localizedContentKey: null
    sourceIds: [slovlex-404-2011]
