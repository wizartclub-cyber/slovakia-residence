openQuestions:
  - 'Розмір оподатковуваних доходів для обновлення пробуту підприємця (§34 ods. 5 і наступні) не внесений — прочитати повністю.'
  - 'Підстави відмови в обновленні: §33 ods. 6 плюс окремі за §34 ods. 12 і 13 (зокрема — подружжя не ведуть спільного сімейного життя).'
  - 'Збори прив''язані лише до трьох найчастіших цілей; повний перелік — у položci 24 písm. d).'
  - 'Мету не треба доводити повторно, якщо обставини за §32 ods. 5 не змінилися (§34 ods. 3 písm. a) — умову не формалізовано.'
