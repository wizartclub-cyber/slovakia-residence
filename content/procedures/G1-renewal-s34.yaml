steps:
  - id: s1-deadline
    order: 1
    title:
      uk: Подати НЕ ПІЗНІШЕ останнього дня чинності пробуту
      sk: Podať NAJNESKÔR v posledný deň platnosti pobytu
    body:
      uk: >-
        Заява подається особисто на офіційному бланку в поліції або через
        електронну службу, і не пізніше останнього дня чинності пробуту
        (§34 ods. 2). Для сезонної зайнятості за §23 ods. 4 — щонайменше за
        30 днів до закінчення. За особу за §27, яка через безпорадність не може
        подати заяву особисто, це може зробити той, з ким вона возз'єднується.
      sk: >-
        Žiadosť sa podáva osobne na úradnom tlačive na policajnom útvare alebo
        elektronickou službou najneskôr v posledný deň platnosti pobytu
        (§34 ods. 2). Pri sezónnom zamestnaní podľa §23 ods. 4 najneskôr 30 dní
        pred skončením platnosti.
    afterDecision: false
    prerequisites: []
    sourceIds: [slovlex-404-2011]
  - id: s2-lawful-while-waiting
    order: 2
    title:
      uk: Поки триває розгляд, перебування лишається законним
      sk: Počas konania sa pobyt považuje za oprávnený
    body:
      uk: >-
        §34 ods. 16: після закінчення чинності пробуту і до рішення про заяву
        про обновлення перебування на території Словаччини вважається законним.
        Тобто прострочення картки саме по собі не робить перебування незаконним,
        якщо заяву подано вчасно.
      sk: >-
        §34 ods. 16: po skončení platnosti pobytu až do rozhodnutia o žiadosti
        o obnovenie sa pobyt považuje za oprávnený.
    afterDecision: false
    prerequisites: [s1-deadline]
    sourceIds: [slovlex-404-2011]
  - id: s3-missing-documents
    order: 3
    title:
      uk: Якщо документа бракує — 30 днів, щоб донести
      sk: Ak doklad chýba — 30 dní na doplnenie
    body:
      uk: >-
        §34 ods. 4: якщо до заяви не додано потрібних документів, їх треба
        донести протягом 30 днів від подання, інакше поліція зупинить
        провадження, і оскаржити це рішення не можна. У обґрунтованих випадках
        строк можуть продовжити на 15 днів. Поліція зобов'язана письмово
        пояснити, чого саме бракує.
      sk: >-
        §34 ods. 4: ak k žiadosti nie sú priložené náležitosti, treba ich doplniť
        do 30 dní od podania, inak policajný útvar konanie zastaví; proti takému
        rozhodnutiu sa nemožno odvolať. Lehotu možno predĺžiť o 15 dní.
    afterDecision: false
    prerequisites: [s1-deadline]
    sourceIds: [slovlex-404-2011]
  - id: s4-notification
    order: 4
    title:
      uk: При задоволенні заяви письмового рішення не видають
      sk: Pri vyhovení sa písomné rozhodnutie nevydáva
    body:
      uk: >-
        §34 ods. 15: якщо заяву задоволено, поліція не видає письмового рішення,
        а надсилає повідомлення з датою обновлення і датою закінчення чинності
        пробуту. Повідомлення отримують також самоврядний край і громада за
        місцем пробуту, а для навчання — ще й школа.
      sk: >-
        §34 ods. 15: pri vyhovení sa písomné rozhodnutie nevydáva, zasiela sa
        oznámenie s dátumom obnovenia a skončenia platnosti pobytu.
    afterDecision: true
    prerequisites: []
    sourceIds: [slovlex-404-2011]
transitionRules: []
