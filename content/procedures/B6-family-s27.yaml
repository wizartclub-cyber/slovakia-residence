openQuestions:
  - 'Категорії родичів за §27 (подружжя, діти, залежні родичі, спеціальні категорії спонсорів) не внесені як умови.'
  - 'Пільга §32 ods. 13 для возз''єднання з особою, якій надано притулок, протягом трьох місяців — не внесена.'
  - 'Возз''єднання родини за правом ЄС (категорія F) — інший маршрут, тут не описаний.'
  - 'Підстави для відмови за §33 ods. 6 не внесені.'
