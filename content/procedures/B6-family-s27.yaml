steps:
  - id: s1-sponsor
    order: 1
    title:
      uk: Житло і згоду доводить той, з ким возз'єднується родина
      sk: Ubytovanie a súhlas preukazuje ten, s kým sa rodina zlučuje
    body:
      uk: >-
        За §32 ods. 11 виконання вимог про забезпечення житлом (§32 ods. 2 písm. e)
        і про згоду (§32 ods. 2 písm. f) доводить не заявник, а особа, з якою він
        возз'єднується. Житло має бути спільним (§32 ods. 8).
      sk: >-
        Podľa §32 ods. 11 splnenie podmienok o ubytovaní (§32 ods. 2 písm. e) a
        o súhlase (§32 ods. 2 písm. f) preukazuje osoba, s ktorou sa rodina zlučuje.
        Ubytovanie musí byť spoločné (§32 ods. 8).
    afterDecision: false
    prerequisites: []
    sourceIds: [slovlex-404-2011]
  - id: s2-civil
    order: 2
    title:
      uk: Підготувати документ РАЦС, що доводить родинний зв'язок
      sk: Pripraviť matričný doklad preukazujúci rodinný vzťah
    body:
      uk: >-
        Для дитини до 18 років, дитини в особистій опіці, неутримуваної дитини,
        залежного батька чи матері або залежної особи за міжнародним договором
        додається ще документ, що підтверджує цю обставину (§32 ods. 5 písm. n).
      sk: >-
        Pri dieťati mladšom ako 18 rokov, dieťati v osobnej starostlivosti,
        nezaopatrenom dieťati, odkázanom rodičovi alebo závislej osobe podľa
        medzinárodnej zmluvy sa prikladá aj doklad o tejto skutočnosti
        (§32 ods. 5 písm. n).
    afterDecision: false
    prerequisites: []
    sourceIds: [slovlex-404-2011]
  - id: s3-after
    order: 3
    title:
      uk: Протягом 30 днів після картки — страхування і медичний висновок
      sk: Do 30 dní od prevzatia dokladu — poistenie a lekársky posudok
    body:
      uk: Для §27 закон вимагає обидва (§32 ods. 9 і §32 ods. 10).
      sk: Pri §27 zákon vyžaduje oboje (§32 ods. 9 a §32 ods. 10).
    afterDecision: true
    prerequisites: [s2-civil]
    sourceIds: [slovlex-404-2011]
