openQuestions:
  - 'Збір за цю процедуру не встановлений: у položci 24 тарифу окремої суми для навчання немає — перевірити, чи вона входить в інший підпункт.'
  - 'Підстава відмови §33 ods. 6 písm. i) стосується саме учнів і студентів: обґрунтована підозра, що особа не зможе виконувати мету перебування.'
  - 'Медичне страхування за §32 ods. 9 для §24 не вимагається — перелік там інший; підтвердити в юриста.'
  - 'Умови мобільності студента (§36b) окремим маршрутом не описані.'
