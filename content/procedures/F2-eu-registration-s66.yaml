openQuestions:
  - 'Повний перелік документів за §66 ods. 4 і далі прочитано лише частково.'
  - 'Збір за реєстрацію не встановлений: у položci 24 тарифу цієї процедури немає.'
  - 'Бланк 11-056 за описом реєстру покриває реєстрацію громадянина ЄС — підтвердити за самим бланком після зняття копії.'
  - 'Права членів родини громадянина ЄС, які не є громадянами ЄС, описані окремо в законі й тут не наведені.'
