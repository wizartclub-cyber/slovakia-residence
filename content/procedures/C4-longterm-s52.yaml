openQuestions:
  - 'ВАЖЛИВО: §52 ods. 2 písm. e) виключає відідента (особу з тимчасовим захистом). Водночас SOURCE_AUDIT згадує вказівку ÚHCP P PZ від 08.04.2026 про зарахування періодів тимчасового захисту до п''яти років. Джерела цієї вказівки в реєстрі немає, і співвідношення двох правил має з''ясувати юрист. Доки цього немає, сайт показує маршрут як виключений для осіб із тимчасовим захистом.'
  - 'Правила обчислення безперервності (§52 ods. 3–5) не внесені як умови.'
  - 'Підстави відмови за §54 ods. 2 не внесені.'
  - 'Перелік документів до заяви за §52 ще не прочитаний.'
  - 'Збір за цю процедуру не встановлений: сума 250 € зі spec §5 стосується постійного проживання, для §52 не перевірена.'
