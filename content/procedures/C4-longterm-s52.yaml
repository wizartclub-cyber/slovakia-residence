steps:
  - id: s1-five-years
    order: 1
    title:
      uk: П'ять років законного і безперервного перебування
      sk: Päť rokov oprávneného a nepretržitého pobytu
    body:
      uk: >-
        Основна підстава — п'ять років законного безперервного перебування в
        Словаччині безпосередньо перед поданням заяви (§52 ods. 1 písm. a).
        Окрема гілка — для власників синьої карти ЄС та деяких інших дозволів:
        п'ять років у Словаччині або державах-членах, із них щонайменше два роки
        як власник синьої карти безпосередньо перед поданням (§52 ods. 1 písm. c).
      sk: >-
        Základným dôvodom je päť rokov oprávneného nepretržitého pobytu na území
        SR bezprostredne pred podaním žiadosti (§52 ods. 1 písm. a). Osobitná
        vetva platí pre držiteľov modrej karty a niektorých ďalších povolení
        (§52 ods. 1 písm. c).
    afterDecision: false
    prerequisites: []
    sourceIds: [slovlex-404-2011]
  - id: s2-excluded
    order: 2
    title:
      uk: Кого §52 не стосується
      sk: Na koho sa §52 nevzťahuje
    body:
      uk: >-
        §52 ods. 2 прямо виключає: заявників про міжнародний захист; осіб із
        притулком або додатковим захистом на підставі возз'єднання родини та з
        гуманітарним притулком; толероване перебування за §58 ods. 3; тих, хто
        просив тимчасовий захист; ВІДІДЕНТІВ (осіб із тимчасовим захистом);
        тимчасове проживання з метою навчання; окремі види особливої діяльності
        (§25 ods. 1 písm. d–f); сезонну зайнятість; випадки §23 ods. 6 písm. b)
        і c); та осіб із привілеями та імунітетами за міжнародним правом.
      sk: >-
        §52 ods. 2 výslovne vylučuje: žiadateľov o medzinárodnú ochranu; azyl
        alebo doplnkovú ochranu na účel zlúčenia rodiny a humanitárny azyl;
        tolerovaný pobyt podľa §58 ods. 3; toho, kto požiadal o dočasné útočisko;
        ODÍDENCOV; prechodný pobyt na účel štúdia; osobitnú činnosť podľa §25
        ods. 1 písm. d) až f); sezónne zamestnanie; prípady §23 ods. 6 písm. b)
        a c); a osoby s výsadami a imunitami.
    afterDecision: false
    prerequisites: []
    sourceIds: [slovlex-404-2011]
