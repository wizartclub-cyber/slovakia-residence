openQuestions:
  - 'Перелік документів до заяви за §43 ще не прочитаний (окрема стаття закону).'
  - 'Підстави відмови внесені окремою приміткою на сторінці маршруту (2026-09-09).'
  - 'Підстава §43 ods. 1 písm. e) («в інтересах Словацької Республіки») не має чітких умов і як правило не внесена.'
  - 'Опитувальник не розрізняє подружжя громадянина СР із постійним проживанням і без нього — умову §43 ods. 1 písm. a) перевірити повністю не можна.'
