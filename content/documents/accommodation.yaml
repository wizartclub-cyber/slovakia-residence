# Джерело: 404/2011 §32 ods. 2 písm. e), §32 ods. 8, §32 ods. 11.
id: accommodation
officialName: Doklad o zabezpečení ubytovania
title:
  uk: Документ про забезпечення житлом
  sk: Doklad o zabezpečení ubytovania
explanation:
  uk: >-
    Має підтверджувати житло щонайменше на шість місяців тимчасового проживання
    (§32 ods. 8). При возз'єднанні родини за §27 підтвердити спільне житло
    зобов'язана особа, з якою відбувається возз'єднання (§32 ods. 11).
  sk: >-
    Musí preukazovať ubytovanie najmenej na šesť mesiacov prechodného pobytu
    (§32 ods. 8). Pri zlúčení rodiny podľa §27 preukazuje spoločné ubytovanie
    ten, s kým sa rodina zlučuje (§32 ods. 11).
requiredWhen:
  uk: >-
    Потрібен, окрім винятків §32 ods. 2 písm. e): щоденні поїздки на роботу або
    навчання через кордон із сусідньої держави; зайнятість у міжнародних
    перевезеннях за §23 ods. 1; навчання чи викладацька і наукова діяльність за
    §24, §25 ods. 1 písm. e), f) або §30; європейська волонтерська служба за
    §25 ods. 1 písm. d) або h); §26 і §29; та родина дослідника за §26 ods. 1.
  sk: >-
    Vyžaduje sa okrem výnimiek podľa §32 ods. 2 písm. e): pravidelné dochádzanie
    do zamestnania alebo školy cez štátnu hranicu; zamestnanie v medzinárodnej
    doprave podľa §23 ods. 1; štúdium alebo pedagogická a výskumná činnosť podľa
    §24, §25 ods. 1 písm. e), f) alebo §30; Európska dobrovoľnícka služba podľa
    §25 ods. 1 písm. d) alebo h); §26 a §29; a rodina výskumníka podľa §26 ods. 1.
requirement: conditional
maxAgeDays: 90
preparationType: obtain_from_third_party
thresholds: []
